server:
  port: 3011
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
  compression:
    enabled: true

spring:
  application:
    name: arsenal-server
  # 虚拟线程（JDK 21）：IO 密集的规则供给服务正合适 ——
  # 这也是仓库里虚拟线程规则自己讲的那个示范。
  threads:
    virtual:
      enabled: true
  jackson:
    serialization:
      indent-output: true

arsenal:
  # 规则数据源。与前端、导出器读的是同一份文件，不做任何副本。
  rules-dir: ${ARSENAL_RULES_DIR:../arsenal-rules}

  lint:
    # 单文件单规则最多回报多少处违规（超出折叠计数），避免报告被噪音淹没
    max-violations-per-rule: 5
    # 单次请求允许扫描的总字节上限，防止一个请求把内存打满
    max-scan-bytes: 2097152

  # 项目工坊（工坊棒1）：注册表 + 代码缓存根目录。
  # 2026-10-18：默认值改到仓库外 D:/arsenal-projects-cache —— 曾经默认落 .data/projects/
  # （相对进程 cwd），用户在仓库根跑服务时缓存落进仓库内，把「军火库仓库自己」添加进工坊
  # 会被 BAD_SOURCE 拒绝（那正是递归复制事故的结构，见 ProjectCache.requireDisjoint）。
  # 工坊分析的是别人的项目，资料一律不入军火库自己的 .data。
  # 注意：此处刻意不写 ${ARSENAL_PROJECTS_DIR:…} 占位符 —— env 优先级由
  # ProjectPaths.resolveRoot（System.getenv）保证，yml 只兜底；且 @Value 对
  # kebab 键不做 relaxed binding（见 ProjectBeans javadoc）。
  projects-dir: D:/arsenal-projects-cache

  # 通用绘图器（Archify / 扳手AI.Archify）—— 选型 IR 的第二个渲染出口。
  # 版式引擎是别人那套 Node 渲染器，不在本仓库里；这里是「页面里点一下出图」需要的那个 Node 环境。
  # 装不装它都不影响军火库其它功能：没装时接口如实报不可用，页面回落到「下载 IR JSON」。
  archify:
    # 技能的入口脚本。装了技能就自动可用，不必配。
    cli: ${ARSENAL_ARCHIFY_CLI:${user.home}/.workbuddy/skills/wrench-ai/bin/wrench-ai.mjs}
    # node 可执行文件。留空 = 先按 PATH 找，再试几个常见安装位置（实测本机在
    # C:/Program Files/nodejs/node.exe 命中）；都不行就显式指到这里。
    node: ${ARSENAL_ARCHIFY_NODE:}
    # 构图检查档位。showcase 是最严档，九项全查 —— 我们的 IR 在它下面九项全过，
    # 所以没有理由退到 standard。
    quality: showcase
    # 单次渲染的超时。实测一次约 1.6 秒；跑到超时基本意味着那个进程卡住了。
    timeout-seconds: 60
    # 单个 IR 的字节上限。实测最大的预设约 12 KB，1 MB 是留足余量的护栏。
    max-spec-bytes: 1048576

  # 代码扫描：依赖坐标 → 技术 key 的映射表（与 arsenal-web 读的是同一份文件）
  scan:
    rules-file: ${ARSENAL_SCAN_RULES:../arsenal-scan/scan_rules.json}

  # 体检：观察项事实源（手写 JSON，随项目走）。读不到不许启动失败 ——
  # 观察项只是「提醒」那一档，P0/P1 档照常出，报告里会写明「事实源不可用 + 为什么」。
  checkups:
    file: ${ARSENAL_CHECKUPS:../arsenal-checkups/checkups.json}

  # 质检台（/qa）：异步深检的 job 状态与报告快照落盘处。
  # 默认在仓库根的 .data/qa/（与解剖台快照同一「别的项目的资料不入库」规矩，见 .gitignore）。
  qa:
    data-dir: ${ARSENAL_QA_DIR:../.data/qa}
    # 同时在跑的深检数。静态段吃内存（源码整份进堆），单机 2 个是稳妥默认。
    pool-size: ${ARSENAL_QA_POOL:2}
    # 语义深检（M2）：OpenAI-compatible chat。未配 key 时整段优雅降级，报告只含静态结论。
    # 铁律：api-key 只走环境变量 ARSENAL_LLM_KEY，绝不写死在此、不落库、不进前端、不进 git、不进日志。
    llm:
      base-url: ${ARSENAL_LLM_BASE_URL:https://api.deepseek.com/v1}
      model: ${ARSENAL_LLM_MODEL:deepseek-chat}
      api-key: ${ARSENAL_LLM_KEY:}
      timeout-seconds: ${ARSENAL_LLM_TIMEOUT:30}
      # 每 job 的 LLM 批数上限，超限即熔断并把余下规则标「未跑-预算」—— 花多少看得见，跑不完说跑不完。
      max-batches-per-job: ${ARSENAL_LLM_MAX_BATCHES:40}

    # C1 · 复现实锤：语义 finding 从「模型说的」升级为「我真的跑红了」。
    # 一条实锤 = 一次 LLM 调用（写测试）+ 一次编译（用户全量 src/main/java）+ attempts 次跑。
    # 所以它的预算闸门必须比 LLM 那一层更紧 —— 不设上限的话，一个 job 能把机器打满。
    repro:
      # 每 job 最多实锤几条。0 = 整段关闭，所有语义 finding 留在待确认档（并如实说明为什么）。
      max-per-job: ${ARSENAL_REPRO_MAX_PER_JOB:5}
      # 每条跑几次取复现率。1 次分不出「稳定复现」与「碰巧红」，所以默认 3。
      attempts: ${ARSENAL_REPRO_ATTEMPTS:3}

    # C4 · 审查员委员会：安全 / 性能 / 并发三路并行审同一批文件，交叉验证后标「共识 / 孤证」。
    # ⚠ 成本是单审的 3 倍 —— 预算闸门必须与功能同时上线，所以这一段一定有三个可配项。
    committee:
      max-batches-per-job: ${ARSENAL_COMMITTEE_MAX_BATCHES:12}
      # 三个审查员并发数。调到 1 就退化成串行（墙钟 ×3），报告里 costNote 会照实说明。
      parallelism: ${ARSENAL_COMMITTEE_PARALLELISM:3}

    # C2 · 改造工坊：一次会话最多应用几处改造点。「人踩油门」不等于「一次能踩一百脚」。
    refactor:
      max-per-session: ${ARSENAL_REFACTOR_MAX_PER_SESSION:20}

  # 编译与跑复现测试要用的本地 maven 仓库；留空 = ~/.m2/repository。
  # 找不到不是启动失败 —— 那只意味着「实锤跑不了」，报告里会如实记成 not-run。
  m2:
    repo: ${M2_REPO:}

  # 案例执行服务：把提交的案例代码用独立 JDK 21 子进程编译运行（虚拟线程等需要 21+）。
  # 2026-10-12 主服务升到 JDK 21 后，默认直接复用主服务的 JDK；
  # ARSENAL_CASE_JDK 仍可显式指到另一个 JDK 21+（比如要钉死某个小版本时）。
  # cases:
  #   jdk-home 留空 = 复用主服务 JDK；显式指到 JDK 21+ 安装目录则覆盖
  cases:
    # 留空 = 自动扫描 ~/.jdks 与常见安装目录里的 JDK 21+；也可显式指到 JDK 21+ 安装目录
    jdk-home: ${ARSENAL_CASE_JDK:}
    # 案例运行的工作根目录；留空 = 系统临时目录
    work-dir: ${ARSENAL_CASE_WORK:}
    # 单次运行超时（毫秒）
    run-timeout-ms: 30000
    # 单次编译超时（毫秒）
    compile-timeout-ms: 30000
    # 单请求捕获的 stdout/stderr 上限（字节，超出截断）
    max-output-bytes: 524288
    # 单次提交最多源文件数
    max-files: 50
    # 单次提交源码总字节上限
    max-source-bytes: 200000
    # 子进程堆上限
    max-heap: 256m

  cors:
    # 默认只放行本地前端 3010；验收/预览站换端口时用 ARSENAL_CORS_ORIGINS 追加（逗号分隔），不把测试端口写进默认值
    allowed-origins: ${ARSENAL_CORS_ORIGINS:http://localhost:3010,http://127.0.0.1:3010}

logging:
  level:
    com.arsenal: INFO
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level %logger{20} - %msg%n"
